name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitburn
          POSTGRES_PASSWORD: fitburn
          POSTGRES_DB: fitburn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitburn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fitburn:fitburn@localhost:5432/fitburn_test?schema=public
      DATABASE_URL_TEST: postgresql://fitburn:fitburn@localhost:5432/fitburn_test?schema=public
      JWT_ACCESS_SECRET: ci-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @fitburn/contracts build

      - name: Generate Prisma client
        run: pnpm --filter @fitburn/api prisma:generate

      - name: Apply migrations to the test database
        run: pnpm --filter @fitburn/api prisma:migrate:test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
