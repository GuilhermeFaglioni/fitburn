services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitburn
      POSTGRES_PASSWORD: fitburn
      POSTGRES_DB: fitburn_dev
    ports:
      - "5432:5432"
    volumes:
      - fitburn_postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitburn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitburn_postgres_data:
