# Servidor do frontend atrás do proxy do Coolify (Traefik, que termina o TLS).
server_tokens off;

# Repassa o protocolo original (https) enviado pelo Traefik; a API usa isso
# para decidir o cookie Secure e o IP real do cliente.
map $http_x_forwarded_proto $fitburn_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API NestJS. Resolvida pelo DNS interno do Docker a cada requisição (variável em vez
    # de "upstream"): o Nginx sobe mesmo com a API fora e acompanha o IP novo após um deploy.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fitburn_api http://api:3333;
        proxy_pass $fitburn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fitburn_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Casca do PWA: nunca em cache, senão um deploy novo não chega ao usuário.
    location ~* ^/(index\.html|sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Rotas do React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
